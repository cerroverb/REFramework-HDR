# Rebases the HDR patches (branch hdr-patches, hdr-imgui-overlay plus fork-only fixes) onto the newest
# praydog/REFramework nightly, builds dinput8.dll and publishes it as a prerelease.
# Build steps are ported from praydog/REFramework .github/workflows/dev-release.yml.
name: HDR Nightly
on:
  push:
    branches: [master]
    paths: [.github/workflows/hdr-nightly.yml]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild and replace the release even if it already exists"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hdr-nightly
  cancel-in-progress: false

env:
  UPSTREAM: praydog/REFramework
  NIGHTLY: praydog/REFramework-nightly
  PATCH_BRANCH: hdr-patches
  TARGET_BRANCH: hdr-nightly
  # GitHub replaces spaces in asset names with dots.
  ZIP_NAME: RE.framework.HDR.zip

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.nightly.outputs.tag }}
      number: ${{ steps.nightly.outputs.number }}
      upstream_sha: ${{ steps.nightly.outputs.sha }}
      head_sha: ${{ steps.push.outputs.head_sha }}
      patch_sha: ${{ steps.push.outputs.patch_sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      # (commits after a Claude Code step are cerroverb's: the action leaves its own git identity behind)
      GIT_AUTHOR_NAME: cerroverb
      GIT_AUTHOR_EMAIL: 84094990+cerroverb@users.noreply.github.com
      GIT_COMMITTER_NAME: cerroverb
      GIT_COMMITTER_EMAIL: 84094990+cerroverb@users.noreply.github.com
    steps:
      - name: Check push token
        id: pat
        env:
          PAT: ${{ secrets.HDR_PUSH_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "::warning::HDR_PUSH_TOKEN is not set. Using GITHUB_TOKEN, which cannot push upstream workflow file changes."
            exit 0
          fi
          headers=$(curl -sS -o /dev/null -D - -H "Authorization: token $PAT" https://api.github.com/user | tr -d '\r' || true)
          status=$(echo "$headers" | awk 'NR==1{print $2}')
          scopes=$(echo "$headers" | sed -n 's/^[Xx]-[Oo][Aa]uth-[Ss]copes: //p')
          expires=$(echo "$headers" | sed -n 's/^[Gg]ithub-[Aa]uthentication-[Tt]oken-[Ee]xpiration: //p')
          echo "HDR_PUSH_TOKEN HTTP \`${status:-none}\`, scopes \`${scopes:-none}\`, expires \`${expires:-never}\`." >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" != 200 ]; then
            echo "::warning::HDR_PUSH_TOKEN was rejected by GitHub (HTTP ${status:-none}). Using GITHUB_TOKEN. Replace the secret."
            exit 0
          fi
          if ! echo "$scopes" | grep -qw workflow; then
            echo "::warning::HDR_PUSH_TOKEN lacks the workflow scope."
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Checkout fork
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0
          token: ${{ steps.pat.outputs.ok == 'true' && secrets.HDR_PUSH_TOKEN || github.token }}

      - name: Find newest upstream nightly
        id: nightly
        run: |
          set -euo pipefail
          source=nightly
          tag_name=$(gh api "repos/$NIGHTLY/releases/latest" --jq .tag_name || true)
          if [[ "$tag_name" =~ ^nightly-([0-9]+)-([0-9a-f]{40})$ ]] \
             && gh api "repos/$UPSTREAM/commits/${BASH_REMATCH[2]}" --jq .sha >/dev/null 2>&1; then
            number=${BASH_REMATCH[1]}
            sha=${BASH_REMATCH[2]}
          else
            source=master-head
            number=head
            sha=$(gh api "repos/$UPSTREAM/commits/master" --jq .sha)
          fi
          tag="nightly-$number-$sha"
          {
            echo "number=$number"
            echo "sha=$sha"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          if [ "$source" = nightly ]; then
            echo "Upstream nightly $number, commit \`$sha\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Fallback.** Could not read a nightly tag from $NIGHTLY (latest tag was \`${tag_name:-none}\`). Using $UPSTREAM master HEAD \`$sha\`." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Nightly tag unreadable, using upstream master HEAD $sha"
          fi

      - name: Skip if already released
        id: exists
        run: |
          patch_sha=$(git rev-parse "origin/$PATCH_BRANCH")
          if [ "${{ inputs.force }}" != true ] \
             && gh release view "${{ steps.nightly.outputs.tag }}" --json body --jq .body 2>/dev/null | grep -q "$patch_sha" \
             && gh release view "${{ steps.nightly.outputs.tag }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "$ZIP_NAME"; then
            echo "Release \`${{ steps.nightly.outputs.tag }}\` already has patch \`$patch_sha\`. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebase patch onto nightly commit
        id: rebase
        if: steps.exists.outputs.exists != 'true'
        run: |
          set -euo pipefail
          sha=${{ steps.nightly.outputs.sha }}
          git config user.name cerroverb
          git config user.email 84094990+cerroverb@users.noreply.github.com
          git remote add upstream "https://github.com/$UPSTREAM.git"
          git fetch --no-tags upstream master
          git fetch --no-tags upstream "$sha"

          base=$(git merge-base "origin/$PATCH_BRANCH" "$sha")
          count=$(git rev-list --count "$base..origin/$PATCH_BRANCH")
          git checkout -q -b rebased "origin/$PATCH_BRANCH"
          echo "PATCH_COUNT=$count" >> "$GITHUB_ENV"
          if ! git rebase --onto "$sha" "$base" 2>rebase.err; then
            git rebase --abort
            # The patch commits as one diff, merged 3-way: what conflicts goes to Claude Code (next step).
            git checkout -q -B rebased "$sha"
            git diff --binary "$base" "origin/$PATCH_BRANCH" > "$RUNNER_TEMP/patch.diff"
            git apply --3way "$RUNNER_TEMP/patch.diff" || true
            files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            [ -n "$files" ] || { echo "::error title=Rebase conflict::$PATCH_BRANCH does not apply on $sha, even as one 3-way diff"; exit 1; }
            echo "PATCH_COUNT=1" >> "$GITHUB_ENV"
            echo "files=$files" >> "$GITHUB_OUTPUT"
            echo "Patch commits from \`$PATCH_BRANCH\` conflict on \`$sha\` in $files. Applied as one diff." >> "$GITHUB_STEP_SUMMARY"
            [ "$HAS_CLAUDE" = true ] || { echo "::error title=Rebase conflict::conflicts in $files and no CLAUDE_CODE_OAUTH_TOKEN"; exit 1; }
          fi

      - name: Resolve the conflicts (Claude Code)
        if: steps.rebase.outputs.files != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            This repository is a fork of praydog/REFramework. The HDR patch commits of branch ${{ env.PATCH_BRANCH }} (the HDR ImGui overlay of praydog/REFramework#1879 plus fork-only fixes) were applied as one 3-way diff onto upstream commit ${{ steps.nightly.outputs.sha }} and conflict in: ${{ steps.rebase.outputs.files }}
            Resolve only those conflicts with the Edit tool. Keep every change of the HDR patch and every upstream change: read both sides with git log and git show (origin/${{ env.PATCH_BRANCH }} and upstream) to learn why each exists. If upstream restructured the code, carry the patch's change over into the new structure. Add no new behaviour, and change nothing outside the conflicts. Keep each file's line endings exactly (some files use CRLF). Remove all conflict markers. Do not stage or commit. If a conflict cannot be resolved with confidence, leave its markers in place and say why.
          claude_args: >-
            --allowedTools "Read,Edit,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git blame:*)"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(git add:*),Bash(curl:*),Bash(gh:*)"

      - name: Check and commit the resolved patch
        if: steps.rebase.outputs.files != ''
        env:
          FILES: ${{ steps.rebase.outputs.files }}
        run: |
          set -euo pipefail
          left=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
          [ "$left" = "$FILES" ] || { echo "::error::Unexpected files in conflict: $left"; exit 1; }
          if grep -nE '^(<<<<<<<|=======$|>>>>>>>)' $FILES; then echo "::error::Conflict markers left"; exit 1; fi
          git add $FILES && git commit -q -m "HDR patches of $(git rev-parse --short "origin/$PATCH_BRANCH") on ${{ steps.nightly.outputs.sha }}"

      - name: Push to ${{ env.TARGET_BRANCH }}
        id: push
        if: steps.exists.outputs.exists != 'true'
        run: |
          set -euo pipefail
          sha=${{ steps.nightly.outputs.sha }}
          count=$PATCH_COUNT
          head=$(git rev-parse HEAD)

          if git ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null; then
            git fetch --no-tags origin "$TARGET_BRANCH"
            old=$(git rev-parse "origin/$TARGET_BRANCH")
            if [ "$(git rev-parse "$old~$count" 2>/dev/null || true)" = "$sha" ] && git diff --quiet "$old" HEAD; then
              head=$old
              echo "$TARGET_BRANCH already holds the patch on \`$sha\`. Not pushed." >> "$GITHUB_STEP_SUMMARY"
            else
              git push --force-with-lease="$TARGET_BRANCH:$old" origin "HEAD:refs/heads/$TARGET_BRANCH"
              echo "Pushed \`$head\` to $TARGET_BRANCH (was \`$old\`)." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            echo "Created $TARGET_BRANCH at \`$head\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"
          echo "patch_sha=$(git rev-parse "origin/$PATCH_BRANCH")" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.head_sha != ''
    uses: ./.github/workflows/hdr-build.yml
    with:
      ref: ${{ needs.prepare.outputs.head_sha }}

  # A failed build goes to Claude Code once: the fix is pushed to the target branch and built again.
  repair:
    needs: [prepare, build]
    if: failure() && needs.prepare.outputs.head_sha != '' && needs.build.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    outputs:
      head_sha: ${{ steps.commit.outputs.head_sha }}
    env:
      HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      # (commits after a Claude Code step are cerroverb's: the action leaves its own git identity behind)
      GIT_AUTHOR_NAME: cerroverb
      GIT_AUTHOR_EMAIL: 84094990+cerroverb@users.noreply.github.com
      GIT_COMMITTER_NAME: cerroverb
      GIT_COMMITTER_EMAIL: 84094990+cerroverb@users.noreply.github.com
    steps:
      - name: Claude Code
        run: '[ "$HAS_CLAUDE" = true ] || { echo "::error::The build failed and there is no CLAUDE_CODE_OAUTH_TOKEN to repair it"; exit 1; }'

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: The failed build's log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --jq '[.jobs[] | select(.conclusion == "failure")][0].id')
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > .build-error.log
          tail -n 40 .build-error.log

      - name: Repair the build (Claude Code)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            This repository is a fork of praydog/REFramework. HEAD is upstream commit ${{ needs.prepare.outputs.upstream_sha }} with the HDR patch commits of branch ${{ env.PATCH_BRANCH }} on top (the HDR ImGui overlay of praydog/REFramework#1879 plus fork-only fixes), and its Windows build (MSVC, target REFramework) failed. The build log is in .build-error.log: read its end first.
            Find the cause and fix it with the smallest change. Most likely upstream changed something the patch uses: carry the patch's change over to upstream's new code, the way upstream's own code now does it. Read both sides with git log, git show and git grep. Change only source files, never .github/ or dependencies/. Add no new behaviour and change nothing unrelated to the error. Keep each file's line endings exactly (some files use CRLF). Do not stage or commit. If the cause is outside the repository (the runner, a download) or not clear, change nothing and say why.
          claude_args: >-
            --allowedTools "Read,Edit,Grep,Glob,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git grep:*),Bash(git status:*),Bash(git blame:*)"
            --disallowedTools "Bash(git push:*),Bash(git commit:*),Bash(git add:*),Bash(curl:*),Bash(gh:*)"

      - name: Check, commit and push the repair
        id: commit
        run: |
          set -euo pipefail
          rm -f .build-error.log
          changed=$(git diff --name-only --ignore-submodules=all)
          [ -n "$changed" ] || { echo "::error::The build failed and was not repaired (see the build job)"; exit 1; }
          echo "repaired: $changed"
          if echo "$changed" | grep -qE '^(\.github|dependencies)/'; then echo "::error::The repair changed protected files"; exit 1; fi
          git diff
          git config user.name cerroverb
          git config user.email 84094990+cerroverb@users.noreply.github.com
          git commit -qam "Repair the build on ${{ needs.prepare.outputs.upstream_sha }}"
          git push -q --force-with-lease="$TARGET_BRANCH:$HEAD_SHA" origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Build repaired in: $changed" >> "$GITHUB_STEP_SUMMARY"

  rebuild:
    needs: [prepare, repair]
    if: always() && needs.repair.result == 'success'
    uses: ./.github/workflows/hdr-build.yml
    with:
      ref: ${{ needs.repair.outputs.head_sha }}

  release:
    needs: [prepare, build, repair, rebuild]
    if: always() && needs.prepare.outputs.head_sha != '' && (needs.build.result == 'success' || needs.rebuild.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download dinput8.dll
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dinput8
          path: out

      - name: Publish prerelease
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          NUMBER: ${{ needs.prepare.outputs.number }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          HEAD_SHA: ${{ needs.repair.outputs.head_sha || needs.prepare.outputs.head_sha }}
          PATCH_SHA: ${{ needs.prepare.outputs.patch_sha }}
        run: |
          set -euo pipefail
          cd out
          # Same contents as REFramework.zip in praydog/REFramework-nightly.
          printf '%s\r\n' "$HEAD_SHA" > reframework_revision.txt
          zip -X "$ZIP_NAME" dinput8.dll reframework_revision.txt
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          cat "$ZIP_NAME.sha256"
          printf '%s\n' \
            "Built from REFramework nightly $NUMBER (praydog/REFramework@${UPSTREAM_SHA:0:12}) with the HDR ImGui menu patch from praydog/REFramework#1879." \
            "" \
            "Source commit ${HEAD_SHA:0:12} on branch $TARGET_BRANCH. SHA256 of the zip is in $ZIP_NAME.sha256." \
            "" \
            "Patch $PATCH_SHA" \
            > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          fi
          gh release create "$TAG" "$ZIP_NAME#RE framework HDR.zip" "$ZIP_NAME.sha256" \
            --prerelease --target "$HEAD_SHA" \
            --title "REFramework HDR $NUMBER (${UPSTREAM_SHA:0:12})" \
            --notes-file notes.md
          {
            echo "Released \`$TAG\`."
            echo '```'
            cat "$ZIP_NAME.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
